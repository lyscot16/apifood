<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ApiFood{% endblock %}</title>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/header.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <header class="main-header">
        <div class="header-top">
            <a href="{{ url_for('main.index') }}" class="logo">ApiFood</a>
            
            <div class="search-bar">
                <input type="text" placeholder="Buscar en Apifood...">
            </div>

            <nav class="main-nav">
                {% if current_user.is_authenticated %}
                    {% if current_user.has_company() %}
                        <a href="{{ url_for('company.read_company') }}" class="nav-link">Mi Negocio</a>
                    {% endif %}
                    <a href="{{ url_for('user.logout') }}" class="nav-link">Cerrar Sesión</a>
                {% else %}
                    <a href="{{ url_for('user.login') }}" class="nav-link">Iniciar Sesión</a>
                    <a href="{{ url_for('user.register') }}" class="nav-link btn-primary">Registrarse</a>
                {% endif %}
                <a href="#" class="nav-link cart-icon"><i class="fas fa-shopping-cart"></i></a>
            </nav>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    {% block scripts %}{% endblock %}
</body>
</html>

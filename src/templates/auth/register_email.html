{% extends "auth/auth_layout.html" %}

{% block title %}Crear Cuenta - ApiFood{% endblock %}

{% block content %}
<div class="auth-content">
    <div class="auth-illustration">
        <img src="https://i.imgur.com/gY8g2Im.png" alt="Food Delivery Illustration">
    </div>
    <div class="auth-card">
        <div class="card-header">
            <h1>Crea tu cuenta gratis</h1>
            <p>Miles de restaurantes y mercados en la palma de tu mano.</p>
        </div>

        <form method="POST" action="{{ url_for('user.register') }}" class="auth-form" id="register-form">
            <div class="form-group">
                <input type="text" id="username" name="username" class="form-control" placeholder="Nombre completo" required autofocus>
            </div>
            <div class="form-group">
                <input type="email" id="email" name="email" class="form-control" placeholder="Correo electrónico" required>
            </div>
            <div class="form-group">
                <input type="password" id="password" name="password" class="form-control" placeholder="Contraseña" required>
            </div>
            <div class="form-group">
                <button type="submit" class="btn btn-primary">Crear Cuenta</button>
            </div>
        </form>

        <div class="auth-switch">
            <p>¿Ya tienes una cuenta? <a href="{{ url_for('user.login') }}">Inicia Sesión</a></p>
        </div>
    </div>
</div>
{% endblock %}
